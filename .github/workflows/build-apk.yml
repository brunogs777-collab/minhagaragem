name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar o projeto Flutter e copiar o código
        run: |
          flutter create --org com.minhagaragem --project-name minha_garagem --platforms android build_app
          cp lib/main.dart build_app/lib/main.dart

      - name: Instalar dependências
        working-directory: build_app
        run: flutter pub add shared_preferences image_picker path_provider mobile_scanner google_mobile_ads url_launcher

      - name: Ajustar o Android (minSdk 24, internet e App ID de teste do AdMob)
        working-directory: build_app
        run: |
          python3 - <<'PY'
          import glob
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = s.replace('</application>', '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>', 1)
          open(m, 'w', encoding='utf-8').write(s)
          for g in glob.glob('android/app/build.gradle*'):
              t = open(g, encoding='utf-8').read().replace('flutter.minSdkVersion', '24')
              open(g, 'w', encoding='utf-8').write(t)
          PY

      - name: Compilar o APK
        working-directory: build_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: minha-garagem-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
