
      - name: Corrigir falha interna do Android Lint
        working-directory: build_app/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for file in Path(".").glob("build.gradle*"):
              content = file.read_text(encoding="utf-8")
              content += """

          subprojects {
              project ->
              if (project.name == "image_picker_android") {
                  project.tasks.configureEach { task ->
                      if (task.name == "lintVitalAnalyzeRelease") {
                          task.enabled = false
                      }
                  }
              }
          }
          """
              file.write_text(content, encoding="utf-8")
          PY
