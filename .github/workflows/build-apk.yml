name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, redesign-colecao-na-pista-v2]

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar o projeto Flutter e copiar o código
        run: |
          flutter create --org com.minhagaragem --project-name minha_garagem --platforms android build_app
          cp lib/main.dart build_app/lib/main.dart

      - name: Instalar dependências
        working-directory: build_app
        run: flutter pub add shared_preferences image_picker path_provider mobile_scanner google_mobile_ads url_launcher share_plus

